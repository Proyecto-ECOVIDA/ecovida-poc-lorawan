[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps = 
	mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
	lewisxhe/XPowersLib @ ^0.2.1
build_flags = 
	-D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
	-D CFG_us915=1
	-D CFG_sx1276_radio=1
	-D HAL_USE_SPI=1
	-D hal_init=LMIC_hal_init